<div class="container">
  <h1>IP Subnet Calculator</h1>
  <p class="subtitle">Enter an IPv4 address and CIDR prefix to calculate subnet details</p>

  <div class="input-row">
    <input type="text" id="ipInput" placeholder="Enter IP address (e.g. 192.168.10.50)">
    <select id="cidrSelect">
      <option value="" disabled selected>Select prefix…</option>
      <option value="8">/8</option>
      <option value="16">/16</option>
      <option value="24">/24</option>
      <option value="25">/25</option>
      <option value="26">/26</option>
      <option value="27">/27</option>
      <option value="28">/28</option>
      <option value="29">/29</option>
      <option value="30">/30</option>
      <option value="31">/31</option>
      <option value="32">/32</option>
    </select>
    <button class="btn-calc" onclick="calculate()">Calculate</button>
    <button class="btn-clear" onclick="clearInputs()">Clear</button>
  </div>

  <div class="error" id="errorBox"></div>
  <div class="loading" id="loadingMsg">Calculating…</div>
  <div id="results" class="hidden"></div>
</div>
