<div class="container">
  <h1>Data Flow — IP Subnet Calculator</h1>
  <p class="subtitle">Watch how a user's IP address travels through each function</p>

  <div class="canvas-wrap">
    <svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
      </defs>
      <rect class="node-rect" id="n-input" x="340" y="20" width="220" height="50"/>
      <text class="node-label" x="450" y="42">User Input</text>
      <text class="node-sub" x="450" y="58">"192.168.10.50 /25"</text>
      <rect class="node-rect" id="n-ipToLong" x="140" y="130" width="200" height="50"/>
      <text class="node-label" x="240" y="152">ipToLong()</text>
      <text class="node-sub" x="240" y="168">string → 32-bit int</text>
      <rect class="node-rect" id="n-cidrToMask" x="560" y="130" width="200" height="50"/>
      <text class="node-label" x="660" y="152">cidrToMask()</text>
      <text class="node-sub" x="660" y="168">prefix → mask int</text>
      <rect class="node-rect" id="n-wildcard" x="560" y="240" width="200" height="50"/>
      <text class="node-label" x="660" y="262">wildcard()</text>
      <text class="node-sub" x="660" y="278">~mask → wildcard int</text>
      <rect class="node-rect" id="n-and" x="280" y="350" width="200" height="50"/>
      <text class="node-label" x="380" y="372">IP &amp; Mask</text>
      <text class="node-sub" x="380" y="388">→ Network Address</text>
      <rect class="node-rect" id="n-or" x="560" y="350" width="200" height="50"/>
      <text class="node-label" x="660" y="372">Net | Wild</text>
      <text class="node-sub" x="660" y="388">→ Broadcast Address</text>
      <rect class="node-rect output" id="n-longToIp" x="140" y="470" width="200" height="50"/>
      <text class="node-label" x="240" y="492">longToIp()</text>
      <text class="node-sub" x="240" y="508">int → dotted-quad</text>
      <rect class="node-rect output" id="n-bin32" x="380" y="470" width="180" height="50"/>
      <text class="node-label" x="470" y="492">bin32() + fmtBin()</text>
      <text class="node-sub" x="470" y="508">→ step display</text>
      <rect class="node-rect output" id="n-hex4" x="620" y="470" width="180" height="50"/>
      <text class="node-label" x="710" y="492">hex4()</text>
      <text class="node-sub" x="710" y="508">→ IPv6 mappings</text>
      <path class="connector" id="c1" d="M380,70 L240,130" marker-end="url(#arrow)"/>
      <path class="connector" id="c2" d="M520,70 L660,130" marker-end="url(#arrow)"/>
      <path class="connector" id="c3" d="M660,180 L660,240" marker-end="url(#arrow)"/>
      <path class="connector" id="c4" d="M240,180 L350,350" marker-end="url(#arrow)"/>
      <path class="connector" id="c5" d="M660,180 L450,350" marker-end="url(#arrow)"/>
      <path class="connector" id="c6" d="M480,375 L660,350" marker-end="url(#arrow)"/>
      <path class="connector" id="c7" d="M660,290 L660,350" marker-end="url(#arrow)"/>
      <path class="connector" id="c8" d="M350,400 L240,470" marker-end="url(#arrow)"/>
      <path class="connector" id="c9" d="M410,400 L470,470" marker-end="url(#arrow)"/>
      <path class="connector" id="c10" d="M660,400 L710,470" marker-end="url(#arrow)"/>
      <circle class="packet" id="pkt1" r="6" cx="0" cy="0" opacity="0"/>
      <circle class="packet" id="pkt2" r="6" cx="0" cy="0" opacity="0"/>
      <circle class="packet green" id="pkt3" r="6" cx="0" cy="0" opacity="0"/>
    </svg>
  </div>

  <div class="legend">
    <span class="l-input">Input / Active</span>
    <span class="l-process">Processing</span>
    <span class="l-output">Output</span>
  </div>

  <div class="controls">
    <button class="btn-play" onclick="play()">▶ Play</button>
    <button class="btn-reset" onclick="reset()">↺ Reset</button>
  </div>
</div>
